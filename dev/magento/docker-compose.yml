services:
  php-fpm:
    build:
      context: ./php
    working_dir: /var/www/html
    volumes:
      - ../../.localdev/magento-docroot:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  cli:
    build:
      context: ./php
    working_dir: /var/www/html
    volumes:
      - ../../.localdev/magento-docroot:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["php"]

  nginx:
    image: nginx:1.25
    ports:
      - "${MAGENTO_PORT:-8090}:80"
    volumes:
      - ../../.localdev/magento-docroot:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm

  mysql:
    image: mysql:5.7
    platform: linux/amd64
    command: --sql-mode=""
    ports:
      - "${MAGENTO_MYSQL_PORT:-3317}:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: "${MAGENTO_DB_NAME:-magento1945}"
      MYSQL_USER: "${MAGENTO_DB_USER:-magento}"
      MYSQL_PASSWORD: "${MAGENTO_DB_PASS:-magento}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - magento1945_mysql:/var/lib/mysql

volumes:
  magento1945_mysql:
