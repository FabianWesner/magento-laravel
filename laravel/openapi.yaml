openapi: 3.1.0
info:
  title: Magento Laravel Legacy API Compatibility
  version: 1.0.0
  summary: Versioned read-only contract inventory for Magento CE 1.9.4.5 API parity.
servers:
  - url: /api/v1
security:
  - LegacyOAuth: []
paths:
  /contracts:
    get:
      operationId: listLegacyApiContracts
      summary: List legacy API contracts tracked for Laravel parity.
      parameters:
        - $ref: '#/components/parameters/Protocol'
        - $ref: '#/components/parameters/Role'
        - $ref: '#/components/parameters/FeatureId'
      responses:
        '200':
          description: Contract inventory response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyApiContractCollection'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      operationId: createLegacyApiContract
      summary: Read-only compatibility inventory endpoint.
      responses:
        '405':
          $ref: '#/components/responses/ReadOnlyContract'
  /contracts/{contract}:
    get:
      operationId: showLegacyApiContract
      summary: Show a tracked legacy API contract by feature ID.
      parameters:
        - $ref: '#/components/parameters/Contract'
      responses:
        '200':
          description: Single contract response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/LegacyApiContract'
        '404':
          $ref: '#/components/responses/ContractNotFound'
    put:
      operationId: replaceLegacyApiContract
      summary: Read-only compatibility inventory endpoint.
      parameters:
        - $ref: '#/components/parameters/Contract'
      responses:
        '405':
          $ref: '#/components/responses/ReadOnlyContract'
    patch:
      operationId: updateLegacyApiContract
      summary: Read-only compatibility inventory endpoint.
      parameters:
        - $ref: '#/components/parameters/Contract'
      responses:
        '405':
          $ref: '#/components/responses/ReadOnlyContract'
    delete:
      operationId: deleteLegacyApiContract
      summary: Read-only compatibility inventory endpoint.
      parameters:
        - $ref: '#/components/parameters/Contract'
      responses:
        '405':
          $ref: '#/components/responses/ReadOnlyContract'
components:
  securitySchemes:
    LegacyOAuth:
      type: oauth2
      description: Preserved REST/API2 OAuth token compatibility boundary during parity.
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes: {}
  parameters:
    Protocol:
      name: protocol
      in: query
      schema:
        type: string
        enum:
          - SOAP
          - XML-RPC
          - REST/API2
    Role:
      name: role
      in: query
      schema:
        type: string
        enum:
          - admin role
          - customer role
          - guest role
          - integration role
    FeatureId:
      name: feature_id
      in: query
      schema:
        $ref: '#/components/schemas/ApiFeatureId'
    Contract:
      name: contract
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ApiFeatureId'
  responses:
    ContractNotFound:
      description: Requested API contract is not in the legacy compatibility inventory.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReadOnlyContract:
      description: API contract inventory is read-only until endpoint parity is approved.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Query filter validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ApiFeatureId:
      type: string
      enum:
        - API-001
        - API-002
        - API-003
        - API-004
        - API-005
        - API-006
    LegacyApiContractCollection:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LegacyApiContract'
        meta:
          type: object
          required:
            - version
            - legacy_api_compatibility
          properties:
            version:
              type: string
              example: v1
            legacy_api_compatibility:
              type: boolean
              example: true
    LegacyApiContract:
      type: object
      required:
        - feature_id
        - name
        - protocol
        - auth
        - version
        - roles
        - legacy_response
        - error_format
      properties:
        feature_id:
          $ref: '#/components/schemas/ApiFeatureId'
        name:
          type: string
        protocol:
          type: string
          enum:
            - SOAP
            - XML-RPC
            - REST/API2
        auth:
          type: string
        version:
          type: string
        roles:
          type: array
          items:
            type: string
        legacy_response:
          type: object
          additionalProperties: true
        error_format:
          $ref: '#/components/schemas/ErrorPayload'
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorPayload'
    ErrorPayload:
      type: object
      required:
        - code
        - message
        - status
      properties:
        code:
          type: string
        message:
          type: string
        status:
          type: integer
